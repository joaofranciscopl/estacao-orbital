name: Construir jogo Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EstacaoOrbital main.py
      - uses: actions/upload-artifact@v4
        with:
          name: EstacaoOrbital-Windows
          path: dist/EstacaoOrbital.exe
          if-no-files-found: error
